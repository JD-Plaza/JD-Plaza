<svg width="940" height="50" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff">
        <animate attributeName="stop-color" values="#00c6ff;#0072ff;#8e2de2;#00c6ff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0072ff">
        <animate attributeName="stop-color" values="#0072ff;#8e2de2;#00c6ff;#0072ff" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="0" y="0" height="50">
        <animate attributeName="width" values="0;940;940;0;0" keyTimes="0;0.55;0.85;0.86;1" dur="9s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#reveal)">
    <text x="0" y="50%" dominant-baseline="middle" text-anchor="start" font-family="Fira Code, monospace" font-size="20" fill="url(#grad1)">12 meses programando · Aprendiendo cada dia · Construyendo proyectos reales</text>
  </g>

  <rect width="3" height="28" y="11" fill="#0072ff">
    <animate attributeName="x" values="0;940;940" keyTimes="0;0.55;1" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;1;0;1;1;0" keyTimes="0;0.1;0.2;0.3;0.85;0.86" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
